services:
  dashboard:
    image: "${DASHBOARD_IMAGE:-ghcr.io/lolson3/lumber-tally-dashboard:latest}"
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_PORT:-8080}:8080"
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      FAKE_DATA_SEED: "${FAKE_DATA_SEED:-demo-seed-v1}"
      MILL_ID: "${MILL_ID:-agwood}"
      DASHBOARD_PORT: "8080"
      TALLY_API_BASE_URL: "${TALLY_API_BASE_URL:-}"
      SFP_API_BASE_URL: "${SFP_API_BASE_URL:-}"
      NFL_API_BASE_URL: "${NFL_API_BASE_URL:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
