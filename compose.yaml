services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumber-tally-dashboard:local
    init: true
    restart: unless-stopped
    ports:
      - "${DASHBOARD_HOST_PORT:-5173}:5173"
    environment:
      DEMO_MODE: "${DEMO_MODE:-true}"
      FAKE_DATA_SEED: "${FAKE_DATA_SEED:-demo-seed-v1}"
      VITE_MILL_ID: "${VITE_MILL_ID:-agwood}"
      VITE_DASHBOARD_PORT: "5173"
      VITE_ALLOWED_HOSTS: "${VITE_ALLOWED_HOSTS:-}"
      VITE_TALLY_API_BASE_URL: "${VITE_TALLY_API_BASE_URL:-}"
      VITE_SFP_API_BASE_URL: "${VITE_SFP_API_BASE_URL:-}"
      VITE_NFL_API_BASE_URL: "${VITE_NFL_API_BASE_URL:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
