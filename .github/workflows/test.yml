name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - name: Build production container
        run: docker build --file docker/Dockerfile --tag lumber-tally-dashboard:test .
      - name: Smoke test production container
        run: |
          docker run --detach --name dashboard-smoke \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 8080:8080 \
            --env DEMO_MODE=false \
            --env MILL_ID=sequoia \
            --env TALLY_API_BASE_URL=http://127.0.0.1:9 \
            lumber-tally-dashboard:test
          trap 'docker rm --force dashboard-smoke' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker logs dashboard-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/runtime-config.js | grep '"millId":"sequoia"'
          curl --fail --silent http://127.0.0.1:8080/manifest.webmanifest | grep 'Sequoia Forest Products'
