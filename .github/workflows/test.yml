name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - name: Build production container
        run: docker build --file docker/Dockerfile --tag lumber-tally-dashboard:test .
      - name: Smoke test production container
        run: |
          api_root="$(mktemp -d)"
          mkdir -p "$api_root/api/bronze"
          printf '{"tables":[]}\n' > "$api_root/api/bronze/tables"
          python3 -m http.server 7304 --bind 0.0.0.0 --directory "$api_root" >/tmp/dashboard-smoke-api.log 2>&1 &
          api_pid=$!
          docker run --detach --name dashboard-smoke \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 8080:8080 \
            --add-host host.docker.internal:host-gateway \
            --health-interval 1s \
            --health-timeout 2s \
            --health-start-period 1s \
            --health-retries 2 \
            --env DEMO_MODE=false \
            --env MILL_ID=sequoia \
            --env TALLY_API_BASE_URL=http://host.docker.internal:7304 \
            lumber-tally-dashboard:test
          trap 'kill "$api_pid" 2>/dev/null || true; docker rm --force dashboard-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dashboard-smoke)" = "healthy" ]; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker logs dashboard-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/runtime-config.js | grep '"millId":"sequoia"'
          curl --fail --silent http://127.0.0.1:8080/manifest.webmanifest | grep 'Sequoia Forest Products'
          curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/readyz)" = "405"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/api/bronze/tables)" = "405"
          curl --silent --head http://127.0.0.1:8080/api/bronze/tables | grep --ignore-case '^Cache-Control: no-store'
          kill "$api_pid"
          wait "$api_pid" 2>/dev/null || true
          curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/readyz)" != "200"
          for attempt in {1..15}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dashboard-smoke)" = "unhealthy" ]; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              docker inspect --format '{{json .State.Health}}' dashboard-smoke
              exit 1
            fi
            sleep 1
          done
