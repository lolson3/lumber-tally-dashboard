<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a27" />
    <title>Lumber Tally Dashboard — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f0e6; color: #102a27; font-family: system-ui, sans-serif; }
      main { width: min(100%, 520px); padding: 32px; border: 1px solid #b7aa8a; border-radius: 16px; background: #fffdf7; box-shadow: 0 16px 40px rgb(16 42 39 / 14%); text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { margin: 16px 0 8px; }
      p { line-height: 1.5; }
      button { padding: 10px 18px; border: 0; border-radius: 8px; color: white; background: #2f6b46; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Dashboard unavailable</h1>
      <p>The application cannot reach the dashboard server. Check this device's network connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
